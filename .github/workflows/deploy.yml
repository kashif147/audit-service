name: Deploy Audit Service

on:
  push:
    branches:
      - gateway
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Sync code
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "chmod -R u+w /home/deploy/membership-platform/audit-service/ 2>/dev/null || true"
          # Never use rsync --delete-excluded: excluded env files must remain on the VM.
          rsync -rlvz --delete \
          --mkpath \
          --no-owner --no-group --no-perms --no-times --omit-dir-times \
          --no-xattrs \
          --safe-links \
          -M--no-owner -M--no-group -M--no-perms -M--omit-dir-times \
          --include '.env.example' \
          --include '.env.sample' \
          --exclude '.env' \
          --exclude '.env.*' \
          --exclude '.env_*' \
          --exclude '*.env' \
          --exclude '.envrc' \
          --exclude '.git/' \
          --exclude '.github/' \
          --exclude 'node_modules/' \
          --exclude '*.log' \
          --itemize-changes \
          --stats \
          -e "ssh -o StrictHostKeyChecking=no" ./ \
          ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/deploy/membership-platform/audit-service/

      - name: Build and restart audit-service
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            cd /home/deploy/membership-platform/audit-service
            docker compose build audit-service
            docker compose up -d audit-service
            echo "Waiting for audit-service health..."
            for i in $(seq 1 30); do
              if docker exec audit-service curl -sf http://localhost:4006/health >/dev/null 2>&1; then
                echo "audit-service is healthy"
                exit 0
              fi
              sleep 2
            done
            echo "audit-service failed to become healthy:"
            docker ps -a --filter name=audit-service
            docker logs audit-service --tail 80
            exit 1
          EOF
