# Postgres: this container must share gateway_app-net with your Postgres service (e.g. reporting-postgres).
# POSTGRES_URI host MUST be that container/service DNS name (e.g. reporting-postgres:5432), not localhost.
# Start Postgres before audit-service (or rely on audit-service DB retry loop until Postgres is up).
services:
  audit-service:
    container_name: audit-service
    build: .
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ${ENV_COMMON_PATH:-../../config/.env.common}
      - .env.staging

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4006/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "4006:4006"
    volumes:
      - ../../logs:/var/log/projectshell
    restart: always
    networks:
      - gateway_app-net

networks:
  gateway_app-net:
    external: true
