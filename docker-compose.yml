# Postgres: this container must share gateway_app-net with reporting-postgres (reporting-service compose).
# POSTGRES_URI host MUST be reporting-postgres:5432 (see .env.staging), not localhost.
# Start reporting-postgres before audit-service:
#   cd /home/deploy/membership-platform/reporting-service && docker compose up -d reporting-postgres
services:
  audit-service:
    container_name: audit-service
    build: .
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ${ENV_COMMON_PATH:-../../config/.env.common}
      - .env.staging

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4006/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    ports:
      - "4006:4006"
    volumes:
      - ../../logs:/var/log/projectshell
    restart: always
    networks:
      - gateway_app-net

networks:
  gateway_app-net:
    external: true
