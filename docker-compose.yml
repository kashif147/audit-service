# Shares reporting-postgres from reporting-service compose (same gateway_app-net).
# Host must be reporting-postgres:5432 — see .env.staging (same credentials as reporting_db).
# Start Postgres first:
#   cd /home/deploy/membership-platform/reporting-service && docker compose up -d reporting-postgres
services:
  audit-service:
    container_name: audit-service
    build: .
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "4006:4006"
    volumes:
      - ../../logs:/var/log/projectshell
    restart: always
    env_file:
      - ${ENV_COMMON_PATH:-../../config/.env.common}
      - .env.staging
    environment:
      RUN_AUDIT_MIGRATIONS: "true"
      GATEWAY_HANDLES_CORS: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4006/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - gateway_app-net

networks:
  gateway_app-net:
    external: true
